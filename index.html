<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32S3 远程控制</title>
<style>
body{font-family:-apple-system,Arial,sans-serif;max-width:420px;margin:24px auto;padding:0 16px;color:#333;background:#fff}
h2{text-align:center;color:#2c3e50;margin-bottom:4px}
.sub{text-align:center;color:#999;font-size:13px;margin-bottom:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;color:#fff}
.badge-on{background:#27ae60}
.badge-off{background:#e74c3c}
.badge-wait{background:#f39c12}
.center{text-align:center}
.card{background:#f7f9fc;border-radius:10px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px 0;font-size:16px;color:#2c3e50}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:none}
.label{color:#888}
.value{font-weight:bold}
.btn{display:block;width:100%;padding:13px;margin-top:10px;border:none;border-radius:8px;font-size:16px;color:#fff;cursor:pointer}
.btn-on{background:#27ae60}.btn-on:hover{background:#219a52}
.btn-off{background:#e74c3c}.btn-off:hover{background:#c0392b}
.btn-mode{background:#3498db}.btn-mode:hover{background:#2980b9}
.btn-mode.active{background:#8e44ad;box-shadow:0 0 0 2px #fff,0 0 0 4px #8e44ad}
.btn-preset{background:#16a085}.btn-preset:hover{background:#138d75}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:0}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid .btn{margin-top:0;padding:11px;font-size:14px}
input[type=range]{width:100%;margin-top:8px}
.hint{font-size:12px;color:#999;text-align:center;margin-top:6px}
.devbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.devbar input{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px;text-align:center}
.devbar button{padding:10px 16px;border:none;border-radius:6px;background:#3498db;color:#fff;font-size:15px;cursor:pointer}
.fine-tune{display:flex;gap:10px;justify-content:center;margin:6px 0 4px 0}
.fine-tune button{width:64px;padding:7px;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:18px;font-weight:bold;cursor:pointer;color:#333}
.fine-tune button:hover{background:#e8f4fd;border-color:#3498db}
.online{text-align:center;font-size:13px;margin-bottom:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;vertical-align:middle}
.tag-led{background:#3498db}
.tag-strip{background:#8e44ad}
</style>
</head>
<body>
<div class="center"><span class="badge badge-wait" id="statusBadge">未连接</span></div>
<h2>ESP32S3 远程控制</h2>
<div class="sub">通过云端 MQTT 控制家里的板子（人在外面时用）</div>
<div style="background:#e8f4fd;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;line-height:1.6">
  <b>在家时无需本页</b>：和板子同一 WiFi 下，直接访问 <b>http://esp32.local</b>（或板子 IP）用本地完整面板，功能最全、不走云端。
</div>

<div class="devbar">
  <input type="text" id="devId" placeholder="设备ID（板子网页『云控制ID』）" value="">
  <button onclick="connectCloud()">连接</button>
</div>
<div class="online" id="onlineInfo"></div>

<div class="card">
  <div class="row"><span class="label">板载灯状态</span><span class="value" id="ledState">--</span></div>
  <div class="row"><span class="label">灯带状态</span><span class="value" id="stripState">--</span></div>
  <div class="row"><span class="label">效果(板载/灯带)</span><span class="value" id="effectName" style="font-size:13px">--</span></div>
</div>

<!-- 总开关：无前缀指令 = 两灯一起 -->
<div class="card">
  <h3>总开关 <span style="font-size:12px;color:#999;font-weight:normal">同时控制两个灯</span></h3>
  <div class="btn-row">
    <button class="btn btn-on" onclick="send('ON')">全部开</button>
    <button class="btn btn-off" onclick="send('OFF')">全部关</button>
  </div>
</div>

<!-- 板载灯：L1: 前缀指令 -->
<div class="card">
  <h3>板载灯 <span class="tag tag-led">GPIO48</span></h3>
  <div class="btn-row">
    <button class="btn btn-on" onclick="send('L1:ON')">开灯</button>
    <button class="btn btn-off" onclick="send('L1:OFF')">关灯</button>
  </div>
  <h3 style="margin-top:14px">亮度 <span id="ledBrightVal2">--</span></h3>
  <input type="range" id="ledBrightness" min="0" max="100" value="80" onchange="send('L1:BRI:'+this.value)">
  <div class="fine-tune">
    <button onclick="bri('led',-5)">-5</button>
    <button onclick="bri('led',5)">+5</button>
    <button onclick="bri('led',-1)">-1</button>
    <button onclick="bri('led',1)">+1</button>
  </div>
  <h3 style="margin-top:14px">颜色</h3>
  <label style="display:block;margin-top:8px;font-size:14px">红色 (R): <span id="ledRedVal">255</span></label>
  <input type="range" id="ledRedSlider" min="0" max="255" value="255" onchange="applyRGB('led')">
  <label style="display:block;margin-top:8px;font-size:14px">绿色 (G): <span id="ledGreenVal">0</span></label>
  <input type="range" id="ledGreenSlider" min="0" max="255" value="0" onchange="applyRGB('led')">
  <label style="display:block;margin-top:8px;font-size:14px">蓝色 (B): <span id="ledBlueVal">0</span></label>
  <input type="range" id="ledBlueSlider" min="0" max="255" value="0" onchange="applyRGB('led')">
  <h3 style="margin-top:14px">效果模式</h3>
  <div class="btn-grid" id="ledEffGrid">
    <button class="btn btn-mode" onclick="setEffect('led',0)">手动</button>
    <button class="btn btn-mode" onclick="setEffect('led',1)">呼吸</button>
    <button class="btn btn-mode" onclick="setEffect('led',2)">彩虹</button>
    <button class="btn btn-mode" onclick="setEffect('led',3)">闪烁</button>
    <button class="btn btn-mode" onclick="setEffect('led',4)">SOS</button>
    <button class="btn btn-mode" onclick="setEffect('led',5)">警灯</button>
    <button class="btn btn-mode" onclick="setEffect('led',6)">海浪</button>
    <button class="btn btn-mode" onclick="setEffect('led',7)">极光</button>
    <button class="btn btn-mode" onclick="setEffect('led',8)">日落</button>
    <button class="btn btn-mode" onclick="setEffect('led',9)">火焰</button>
  </div>
  <h3 style="margin-top:14px">情景预设</h3>
  <div class="btn-grid">
    <button class="btn btn-preset" onclick="send('L1:PRESET:read')">阅读模式</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:sleep')">睡眠模式</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:party')">派对模式</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:eye')">护眼模式</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:random')">随机颜色</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:wave')">海浪模式</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:fire')">火焰篝火</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:aurora')">极光之夜</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:breathe')">呼吸助眠</button>
    <button class="btn btn-preset" onclick="send('L1:PRESET:sunset')">日落余晖</button>
  </div>
</div>

<!-- 灯带：L2: 前缀指令 -->
<div class="card">
  <h3>灯带 <span class="tag tag-strip">GPIO15</span></h3>
  <div class="btn-row">
    <button class="btn btn-on" onclick="send('L2:ON')">开灯</button>
    <button class="btn btn-off" onclick="send('L2:OFF')">关灯</button>
  </div>
  <h3 style="margin-top:14px">亮度 <span id="stripBrightVal2">--</span></h3>
  <input type="range" id="stripBrightness" min="0" max="100" value="80" onchange="send('L2:BRI:'+this.value)">
  <div class="fine-tune">
    <button onclick="bri('strip',-5)">-5</button>
    <button onclick="bri('strip',5)">+5</button>
    <button onclick="bri('strip',-1)">-1</button>
    <button onclick="bri('strip',1)">+1</button>
  </div>
  <h3 style="margin-top:14px">颜色</h3>
  <label style="display:block;margin-top:8px;font-size:14px">红色 (R): <span id="stripRedVal">255</span></label>
  <input type="range" id="stripRedSlider" min="0" max="255" value="255" onchange="applyRGB('strip')">
  <label style="display:block;margin-top:8px;font-size:14px">绿色 (G): <span id="stripGreenVal">0</span></label>
  <input type="range" id="stripGreenSlider" min="0" max="255" value="0" onchange="applyRGB('strip')">
  <label style="display:block;margin-top:8px;font-size:14px">蓝色 (B): <span id="stripBlueVal">0</span></label>
  <input type="range" id="stripBlueSlider" min="0" max="255" value="0" onchange="applyRGB('strip')">
  <h3 style="margin-top:14px">效果模式</h3>
  <div class="btn-grid" id="stripEffGrid">
    <button class="btn btn-mode" onclick="setEffect('strip',0)">手动</button>
    <button class="btn btn-mode" onclick="setEffect('strip',1)">呼吸</button>
    <button class="btn btn-mode" onclick="setEffect('strip',2)">彩虹</button>
    <button class="btn btn-mode" onclick="setEffect('strip',3)">闪烁</button>
    <button class="btn btn-mode" onclick="setEffect('strip',4)">SOS</button>
    <button class="btn btn-mode" onclick="setEffect('strip',5)">警灯</button>
    <button class="btn btn-mode" onclick="setEffect('strip',6)">海浪</button>
    <button class="btn btn-mode" onclick="setEffect('strip',7)">极光</button>
    <button class="btn btn-mode" onclick="setEffect('strip',8)">日落</button>
    <button class="btn btn-mode" onclick="setEffect('strip',9)">火焰</button>
  </div>
  <h3 style="margin-top:14px">情景预设</h3>
  <div class="btn-grid">
    <button class="btn btn-preset" onclick="send('L2:PRESET:read')">阅读模式</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:sleep')">睡眠模式</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:party')">派对模式</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:eye')">护眼模式</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:random')">随机颜色</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:wave')">海浪模式</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:fire')">火焰篝火</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:aurora')">极光之夜</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:breathe')">呼吸助眠</button>
    <button class="btn btn-preset" onclick="send('L2:PRESET:sunset')">日落余晖</button>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var EFFECT_NAMES = ['手动','呼吸灯','彩虹渐变','闪烁','SOS','警灯','海浪','极光','日落','火焰'];
var client = null;
var devId = '';

function getDevId(){
  var v=document.getElementById('devId').value.trim().toUpperCase();
  return v;
}
function topic(name){return 'esp32s3/light/'+devId+'/'+name;}

function send(cmd){
  if(!client || !client.connected){alert('未连接云端，请先连接');return;}
  client.publish(topic('cmd'), cmd);
}

function connectCloud(){
  var id=getDevId();
  if(!id){alert('请输入设备ID');return;}
  devId=id;
  localStorage.setItem('devId',devId);
  if(client){try{client.end(true);}catch(e){}}
  var badge=document.getElementById('statusBadge');
  badge.textContent='连接中...';badge.className='badge badge-wait';
  client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{
    clientId:'web_'+Math.random().toString(16).substr(2,8)
  });
  client.on('connect',function(){
    badge.textContent='已连接云端';badge.className='badge badge-on';
    document.getElementById('onlineInfo').textContent='设备ID: '+devId;
    client.subscribe(topic('status'));
    client.publish(topic('cmd'),'QUERY');
  });
  client.on('message',function(t,buf){
    try{
      var d=JSON.parse(buf.toString());
      updateUI(d);
    }catch(e){}
  });
  client.on('error',function(e){
    badge.textContent='连接失败';badge.className='badge badge-off';
  });
  client.on('close',function(){
    badge.textContent='连接断开';badge.className='badge badge-off';
  });
}

function updateUI(d){
  // 板载灯状态（无后缀字段）
  document.getElementById('ledState').textContent=d.ledOn?('已开启 '+d.brightness+'%'):'已关闭';
  document.getElementById('ledState').style.color=d.ledOn?'#27ae60':'#999';
  document.getElementById('ledBrightVal2').textContent=d.brightness;
  document.getElementById('ledBrightness').value=d.brightness;
  document.getElementById('ledRedSlider').value=d.red;
  document.getElementById('ledGreenSlider').value=d.green;
  document.getElementById('ledBlueSlider').value=d.blue;
  document.getElementById('ledRedVal').textContent=d.red;
  document.getElementById('ledGreenVal').textContent=d.green;
  document.getElementById('ledBlueVal').textContent=d.blue;
  // 灯带状态（2 后缀字段）
  document.getElementById('stripState').textContent=d.ledOn2?('已开启 '+d.brightness2+'%'):'已关闭';
  document.getElementById('stripState').style.color=d.ledOn2?'#27ae60':'#999';
  document.getElementById('stripBrightVal2').textContent=d.brightness2;
  document.getElementById('stripBrightness').value=d.brightness2;
  document.getElementById('stripRedSlider').value=d.red2;
  document.getElementById('stripGreenSlider').value=d.green2;
  document.getElementById('stripBlueSlider').value=d.blue2;
  document.getElementById('stripRedVal').textContent=d.red2;
  document.getElementById('stripGreenVal').textContent=d.green2;
  document.getElementById('stripBlueVal').textContent=d.blue2;
  // 效果名称 + 按钮高亮（两个区域）
  document.getElementById('effectName').textContent=
    (EFFECT_NAMES[d.effect]||'手动')+' / '+(EFFECT_NAMES[d.effect2]||'手动');
  var ledBtns=document.getElementById('ledEffGrid').children;
  for(var i=0;i<ledBtns.length;i++){
    ledBtns[i].className='btn btn-mode'+(d.effect==i?' active':'');
  }
  var stripBtns=document.getElementById('stripEffGrid').children;
  for(var j=0;j<stripBtns.length;j++){
    stripBtns[j].className='btn btn-mode'+(d.effect2==j?' active':'');
  }
}

// 按灯应用 RGB：t='led' → L1:RGB:，t='strip' → L2:RGB:
function applyRGB(t){
  var p=(t==='led')?'led':'strip';
  var r=document.getElementById(p+'RedSlider').value;
  var g=document.getElementById(p+'GreenSlider').value;
  var b=document.getElementById(p+'BlueSlider').value;
  document.getElementById(p+'RedVal').textContent=r;
  document.getElementById(p+'GreenVal').textContent=g;
  document.getElementById(p+'BlueVal').textContent=b;
  send((t==='led'?'L1:':'L2:')+'RGB:'+r+','+g+','+b);
}
// 亮度微调
function bri(t,d){
  var p=(t==='led')?'led':'strip';
  var s=document.getElementById(p+'Brightness');
  var v=parseInt(s.value)+d;
  if(v<0)v=0; if(v>100)v=100;
  s.value=v;
  document.getElementById(p+'BrightVal2').textContent=v;
  send((t==='led'?'L1:':'L2:')+'BRI:'+v);
}
function setEffect(t,m){
  send((t==='led'?'L1:':'L2:')+'EFF:'+m);
}

// 自动恢复上次设备ID
var saved=localStorage.getItem('devId');
if(saved){document.getElementById('devId').value=saved;}
</script>
</body>
</html>
